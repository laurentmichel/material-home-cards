<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="page.css">
<script src="icons.js"></script><script src="common.js"></script><script src="../../dist/material-home-cards.js"></script>
<div class="half dark"></div><div class="half light"></div>
<script>
// Illustration fictive d'une entrée de maison : jamais d'image d'une vraie caméra.
const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb8de"/><stop offset="1" stop-color="#d9e8f2"/></linearGradient>
<linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b7a98f"/><stop offset="1" stop-color="#8d7f66"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<ellipse cx="1250" cy="430" rx="260" ry="150" fill="#5f8a55"/><ellipse cx="1450" cy="460" rx="200" ry="130" fill="#4f7a48"/>
<rect x="0" y="0" width="560" height="900" fill="#e8dcc6"/><rect x="560" y="0" width="22" height="900" fill="#cdbfa6"/>
<polygon points="760,330 980,200 1200,330" fill="#7d5a4a"/><rect x="790" y="330" width="380" height="250" fill="#efe6d6"/>
<rect x="940" y="410" width="80" height="170" fill="#6b4a3a"/><rect x="830" y="380" width="70" height="60" fill="#9cc3dc"/><rect x="1070" y="380" width="70" height="60" fill="#9cc3dc"/>
<rect x="0" y="560" width="1600" height="340" fill="url(#ground)"/>
<polygon points="620,900 900,580 1060,580 1250,900" fill="#cfc3ad"/>
<rect x="640" y="430" width="60" height="150" rx="6" fill="#4a4f55"/><rect x="630" y="420" width="80" height="20" rx="6" fill="#5b6168"/>
<rect x="1290" y="470" width="250" height="120" rx="18" fill="#f2f2f2"/><rect x="1300" y="490" width="80" height="45" rx="6" fill="#9cc3dc"/><circle cx="1340" cy="600" r="26" fill="#2d2d2d"/><circle cx="1490" cy="600" r="26" fill="#2d2d2d"/>
<rect x="250" y="250" width="160" height="220" rx="8" fill="#6b4a3a"/><circle cx="385" cy="370" r="8" fill="#e0c070"/></svg>`;
const image = 'data:image/svg+xml;base64,' + btoa(svg);
const hass = fakeHass({ 'camera.front': { entity_id: 'camera.front', state: 'idle', last_updated: '1', attributes: { friendly_name: 'Front door', entity_picture: '' } } });
for (const half of document.querySelectorAll('.half')) {
  const card = document.createElement('m3-camera-card');
  card.setConfig({ type: 'custom:m3-camera-card', entity: 'camera.front', show_name: true });
  half.appendChild(card);
  card.hass = hass;
  card._els.poster.src = image;
  setTimeout(() => card._setPlaying(true), 50);
}
</script>
